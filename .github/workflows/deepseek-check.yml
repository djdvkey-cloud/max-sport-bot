name: Одноразовая проверка DeepSeek

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deepseek-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v6

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установить библиотеки
        run: pip install maxapi aiohttp

      - name: Проверить все 6 клубов через DeepSeek
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FORCE_MODE: morning
        run: python sport_bot.py
