name: Спортивные оповещения

on:
  # Бот перенесён на постоянный хостинг Amvera (проект sports-bot, тем же
  # способом, что и myach-bot) — расписание здесь ОТКЛЮЧЕНО намеренно.
  # Причина переноса: утро 14.09.2026 показало, что GitHub Actions может
  # молча не запустить scheduled job вообще (cron `0 5 * * *` просто не
  # сработал, ни одной ошибки в логах не было) — оповещение по Уралу чуть
  # не потерялось. Постоянный процесс на Amvera сам следит за временем и
  # не зависит от чужого расписания. Если schedule оставить активным,
  # GitHub Actions и Amvera будут слать оповещения по одним и тем же
  # матчам одновременно — дубли.
  # workflow_dispatch оставлен для ручной отладки конкретной ветки отсюда.
  workflow_dispatch:   # кнопка ручного запуска, для проверки
    inputs:
      mode:
        description: 'Режим (auto — как обычно, по текущему часу; morning/results — принудительно, для ручной проверки конкретной ветки)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - results
      dry_run:
        description: 'Тихий режим — не слать в реальный MAX-чат, только печатать в лог что было бы отправлено'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v6

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установить библиотеки
        run: pip install maxapi aiohttp

      - name: Проверить защиту от неверного счёта и неосновных составов
        run: |
          python -m py_compile sport_bot.py
          python -m unittest discover -s tests -v

      - name: Проверить матчи и отправить оповещения
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FORCE_MODE: ${{ github.event.inputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python sport_bot.py

      # Сохраняем state (что сегодня играет, отправлен ли результат) между
      # запусками — без этого коммита следующий тик ничего бы не помнил.
      - name: Сохранить состояние матчей дня
        run: |
          git config user.name "Спортбот"
          git config user.email "actions@github.com"
          git add data/today_matches.json 2>/dev/null || true
          git commit -m "Состояние на $(date -u +%d.%m.%Y_%H:%M)" || echo "изменений нет"
          git push || echo "запушить не вышло — не страшно"
