name: Узнать chat_id группы MAX

on:
  workflow_dispatch:   # только кнопка ручного запуска, без расписания

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v6

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установить библиотеки
        run: pip install maxapi

      - name: Слушать сообщения и напечатать chat_id
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: python get_chat_id.py
