name: Одноразовая проверка защиты результатов

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/safety-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install maxapi aiohttp
      - name: Проверить синтаксис и защитные сценарии
        run: |
          python -m py_compile sport_bot.py tests/test_sport_bot.py
          python -m unittest discover -s tests -v
